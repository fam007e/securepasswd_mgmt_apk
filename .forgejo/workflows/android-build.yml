name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:

    runs-on: codeberg-medium

    steps:
    - uses: https://github.com/actions/checkout@v4
      with:
        submodules: recursive

    - name: set up JDK 17
      uses: https://github.com/actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: https://github.com/android-actions/setup-android@v3
      with:
        packages: 'platform-tools ndk;25.1.8937393 cmake;3.22.1'

    - name: Debug Environment
      run: |
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
        if [ -d "$ANDROID_HOME/cmdline-tools" ]; then
          find "$ANDROID_HOME/cmdline-tools" -name "sdkmanager" -exec {} --list \; || true
        fi

    - name: Create local.properties
      run: |
        SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
        echo "sdk.dir=$SDK_PATH" > local.properties
        echo "ndk.version=25.1.8937393" >> local.properties
        echo "--- local.properties ---"
        cat local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Upload APK
      uses: https://github.com/actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

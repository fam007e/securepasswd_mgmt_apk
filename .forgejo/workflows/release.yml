name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: codeberg-medium
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          submodules: recursive

      - name: set up JDK 25
        uses: https://github.com/actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: https://github.com/android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0 platforms;android-36 ndk;25.1.8937393 cmake;3.22.1'

      - name: Debug Environment
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          if [ -d "$ANDROID_HOME/cmdline-tools" ]; then
            find "$ANDROID_HOME/cmdline-tools" -name "sdkmanager" -exec {} --list \; || true
          fi

      - name: Create local.properties
        run: |
          SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK_PATH" > local.properties
          echo "ndk.version=25.1.8937393" >> local.properties
          echo "--- local.properties ---"
          cat local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease -Ptarget.abis=arm64-v8a,armeabi-v7a --stacktrace

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          JAVA_TOOL_OPTIONS: "--enable-native-access=ALL-UNNAMED"
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 --decode > keystore.jks

          mkdir -p signed-apks

          find app/build/outputs/apk/release -name "*.apk" | while read -r apk; do
            filename=$(basename "$apk")

            if [[ "$filename" == *"-signed.apk" ]]; then continue; fi

            new_name=$(echo "$filename" | \
              sed 's/app-//' | \
              sed 's/arm64-v8a/v8a/' | \
              sed 's/armeabi-v7a/v7a/' | \
              sed 's/-release-unsigned//' | \
              sed 's/-unsigned//' | \
              sed 's/^/securepasswd-/')

            echo "Signing $filename as $new_name..."

            $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
              --ks keystore.jks \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --v4-signing-enabled false \
              --out "signed-apks/$new_name" \
              "$apk"

            $ANDROID_HOME/build-tools/35.0.0/apksigner verify "signed-apks/$new_name"
          done

          rm -f signed-apks/*.idsig

      - name: Cleanup keystore
        if: always()
        run: rm -f keystore.jks

      - name: Create and upload release
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          direction: upload
          tag: ${{ github.ref_name }}
          title: "SecurePasswd MGMT ${{ github.ref_name }}"
          release-dir: signed-apks
          token: ${{ secrets.FORGEJO_TOKEN }}
          release-notes-assistant: true
          override: true          # important: allows re-running the workflow without failing if release already exists
          # Optional extras you might want:
          # prerelease: true
          # verbose: true         # for more debug output in logs

name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: codeberg-medium
    timeout-minutes: 180
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          submodules: recursive

      - name: set up JDK 25
        uses: https://github.com/actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: https://github.com/android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 ndk;25.1.8937393 cmake;3.30.3'

      - name: Debug Environment
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          if [ -d "$ANDROID_HOME/cmdline-tools" ]; then
            find "$ANDROID_HOME/cmdline-tools" -name "sdkmanager" -exec {} --list \; || true
          fi

      - name: Create local.properties
        run: |
          SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK_PATH" > local.properties
          echo "ndk.version=25.1.8937393" >> local.properties
          echo "--- local.properties ---"
          cat local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease -Ptarget.abis=arm64-v8a,armeabi-v7a --stacktrace

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          # Decode keystore
          echo "$SIGNING_KEY_BASE64" | base64 --decode > keystore.jks

          # Find unsigned APK
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          SIGNED_APK="app/build/outputs/apk/release/app-release-signed.apk"

          # Sign using environment variables
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          # Verify
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify "$SIGNED_APK"
          echo "SIGNED_APK=$SIGNED_APK" >> $GITHUB_ENV

      - name: Cleanup keystore
        if: always()
        run: rm -f keystore.jks

      - name: Create Release
        uses: https://github.com/softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.SIGNED_APK }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

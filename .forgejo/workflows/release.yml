name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: codeberg-medium
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          submodules: recursive

      - name: set up JDK 17
        uses: https://github.com/actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: https://github.com/android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;25.1.8937393'

      - name: Debug Environment
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          if [ -d "$ANDROID_HOME/cmdline-tools" ]; then
            find "$ANDROID_HOME/cmdline-tools" -name "sdkmanager" -exec {} --list \; || true
          fi
          cmake --version || echo "System cmake not found"

      - name: Create local.properties
        run: |
          # Use existing ANDROID_HOME or the user's suggested path
          SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK_PATH" > local.properties
          echo "ndk.version=25.1.8937393" >> local.properties
          
          # Discover system cmake to satisfy 3.25+ requirement
          CMAKE_BIN=$(which cmake || echo "")
          if [ -n "$CMAKE_BIN" ]; then
              CMAKE_DIR=$(dirname $(dirname "$CMAKE_BIN"))
              echo "cmake.dir=$CMAKE_DIR" >> local.properties
              echo "Found system cmake at $CMAKE_BIN, setting cmake.dir=$CMAKE_DIR"
          fi
          
          echo "--- local.properties ---"
          cat local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APK
        uses: https://github.com/r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Create Release
        uses: https://github.com/softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.sign_app.outputs.signedReleaseFile }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Dispatch Smoke H

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - name: Build Release APK (Build 1)
        env:
          SOURCE_DATE_EPOCH: "1711075200"
        run: |
          ./gradlew :app:assembleRelease -PenableSplits -Ptarget.abis=arm64-v8a,armeabi-v7a --dependency-verification strict --stacktrace --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process
          mkdir -p build1
          cp app/build/outputs/apk/release/*.apk build1/
          (cd build1 && sha256sum *.apk > ../build1.sha256)

      - name: Clean Workspace for Build 2
        run: |
          ./gradlew clean
          rm -rf app/build .gradle/configuration-cache

      - name: Build Release APK (Build 2 - Reproducibility Verification)
        env:
          SOURCE_DATE_EPOCH: "1711075200"
        run: |
          ./gradlew :app:assembleRelease -PenableSplits -Ptarget.abis=arm64-v8a,armeabi-v7a --dependency-verification strict --stacktrace --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process
          mkdir -p build2
          cp app/build/outputs/apk/release/*.apk build2/
          (cd build2 && sha256sum *.apk > ../build2.sha256)

      - name: Verify Reproducibility Across Builds
        run: |
          echo "Comparing checksums between Build 1 and Build 2..."
          diff -u build1.sha256 build2.sha256
          echo "Reproducible build verification successful: both independent builds produced identical APK binaries."

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          JAVA_TOOL_OPTIONS: "--enable-native-access=ALL-UNNAMED"
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 --decode > keystore.jks

          mkdir -p signed-apks

          find app/build/outputs/apk/release -name "*.apk" | while read -r apk; do
            filename=$(basename "$apk")

            if [[ "$filename" == *"-signed.apk" ]]; then continue; fi

            new_name=$(echo "$filename" | \
              sed 's/app-//' | \
              sed 's/arm64-v8a/v8a/' | \
              sed 's/armeabi-v7a/v7a/' | \
              sed 's/-release-unsigned//' | \
              sed 's/-unsigned//' | \
              sed 's/^/securepasswd-/')

            echo "Signing $filename as $new_name..."

            $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
              --ks keystore.jks \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --v4-signing-enabled false \
              --out "signed-apks/$new_name" \
              "$apk"

            $ANDROID_HOME/build-tools/35.0.0/apksigner verify "signed-apks/$new_name"
          done

          (cd signed-apks && sha256sum *.apk > SHA256SUMS)
          cat signed-apks/SHA256SUMS

          rm -f signed-apks/*.idsig

      - name: Cleanup keystore
        if: always()
        run: rm -f keystore.jks

name: Dispatch Smoke O (base64-text secret)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - name: env test L
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 --decode > keystore.jks
          ls -la keystore.jks
